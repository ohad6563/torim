<!doctype html>
<!--
  ILLUSTRATION ONLY (labelled "המחשה" in the app) for the before/after slider,
  until real photos of the studio's work are added. Same framing in both images.
-->
<html><head><meta charset="utf-8"></head><body style="margin:0">
<canvas id="c" width="1080" height="1080"></canvas>
<script>
const W = 1080, H = 1080, c = document.getElementById('c'), g = c.getContext('2d');
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }
const archY = (u) => 520 - Math.sin(Math.PI * Math.pow(u, 0.85)) * 150; // brow arch, peak ~2/3 along

function skin(r) {
  const bg = g.createLinearGradient(0, 0, W, H);
  bg.addColorStop(0, '#e9c9b2'); bg.addColorStop(0.5, '#ddb79d'); bg.addColorStop(1, '#c99e83');
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  const hl = g.createRadialGradient(W * 0.55, H * 0.3, 40, W * 0.55, H * 0.3, 700);
  hl.addColorStop(0, 'rgba(255,240,228,0.45)'); hl.addColorStop(1, 'rgba(255,240,228,0)');
  g.fillStyle = hl; g.fillRect(0, 0, W, H);
  // Pores / texture.
  for (let i = 0; i < 9000; i++) {
    g.fillStyle = `rgba(120,70,50,${0.03 + r() * 0.05})`;
    g.beginPath(); g.arc(r() * W, r() * H, 0.6 + r() * 1.4, 0, Math.PI * 2); g.fill();
  }
  // Closed-eye lash line and lid crease below the brow.
  g.strokeStyle = 'rgba(70,40,30,0.55)'; g.lineWidth = 7; g.lineCap = 'round';
  g.beginPath(); g.moveTo(250, 860); g.quadraticCurveTo(560, 960, 860, 840); g.stroke();
  g.strokeStyle = 'rgba(120,75,60,0.25)'; g.lineWidth = 5;
  g.beginPath(); g.moveTo(270, 790); g.quadraticCurveTo(560, 860, 840, 770); g.stroke();
  for (let i = 0; i < 70; i++) { // lashes
    const u = i / 69, x = 260 + u * 590, y = 860 + Math.sin(Math.PI * u) * 85 - 8;
    g.strokeStyle = 'rgba(40,24,18,0.7)'; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 6, y + 30, x + 14 + u * 10, y + 48); g.stroke();
  }
}

function hair(x, y, len, ang, w, a) {
  g.strokeStyle = `rgba(52,32,22,${a})`; g.lineWidth = w; g.lineCap = 'round';
  g.beginPath(); g.moveTo(x, y);
  g.quadraticCurveTo(x + Math.cos(ang) * len * 0.5, y + Math.sin(ang) * len * 0.5 - 6, x + Math.cos(ang) * len, y + Math.sin(ang) * len);
  g.stroke();
}

function before() {
  const r = rng(11); skin(rng(5));
  // Sparse, uneven, faded brow with gaps and stray hairs.
  for (let i = 0; i < 260; i++) {
    const u = r(); if (u > 0.55 && u < 0.68 && r() < 0.7) continue; // gap
    const x = 190 + u * 700, y = archY(u) + (r() - 0.5) * 70 + 10;
    hair(x, y, 18 + r() * 30, -1.1 + u * 1.5 + (r() - 0.5) * 0.9, 2 + r() * 2, 0.25 + r() * 0.35);
  }
  for (let i = 0; i < 40; i++) hair(200 + r() * 700, archY(r()) + 70 + r() * 70, 14 + r() * 16, r() * 3, 2, 0.35); // strays below
  for (let i = 0; i < 18; i++) hair(250 + r() * 600, archY(r()) - 80 - r() * 40, 12 + r() * 14, r() * 3, 2, 0.3); // strays above
}

function after() {
  const r = rng(11); skin(rng(5));
  // Full, shaped, symmetric brow: dense strokes inside a clean tapered shape.
  for (let i = 0; i < 900; i++) {
    const u = r(), thick = 52 * (1 - Math.pow(u, 1.6)) + 10; // thicker at the head, fine tail
    const x = 200 + u * 690, y = archY(u) + (r() - 0.5) * thick + 8;
    hair(x, y, 20 + r() * 26, -1.15 + u * 1.55 + (r() - 0.5) * 0.35, 2.2 + r() * 1.6, 0.5 + r() * 0.35);
  }
  // Soft tint underneath (like a light henna / pencil fill).
  g.globalCompositeOperation = 'multiply';
  g.fillStyle = 'rgba(150,100,80,0.18)';
  g.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40; g.lineTo(200 + u * 690, archY(u) - (26 * (1 - Math.pow(u, 1.6)) + 5)); }
  for (let i = 40; i >= 0; i--) { const u = i / 40; g.lineTo(200 + u * 690, archY(u) + (26 * (1 - Math.pow(u, 1.6)) + 5) + 16); }
  g.closePath(); g.fill(); g.globalCompositeOperation = 'source-over';
}
window.draw = (which) => { which === 'before' ? before() : after(); return c.toDataURL('image/jpeg', 0.85); };
</script></body></html>
