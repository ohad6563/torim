<!doctype html>
<!--
  Brand loop for the login / home background (8 s, seamless).
  Deterministic: frame(t) draws time t in seconds; every motion uses a period
  that divides 8 s, so the last frame flows into the first.
  Rendered by tools/media/render.js -> assets/video/hero-loop.mp4
-->
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="720" height="1280"></canvas>
<script>
const W = 720, H = 1280, T = 8, TAU = Math.PI * 2;
const c = document.getElementById('c'), g = c.getContext('2d');

// Seeded random so every render is identical.
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// Out-of-focus lights (bokeh discs with a brighter rim, like a real lens).
const bokeh = Array.from({ length: 13 }, () => ({
  x: rnd() * W, y: rnd() * H, r: 26 + rnd() * 70,
  ax: 18 + rnd() * 40, ay: 24 + rnd() * 60, ph: rnd() * TAU, k: 1,
  a: 0.08 + rnd() * 0.14, hue: rnd() < 0.65 ? [255, 196, 150] : [255, 228, 205],
}));
// Dust drifting through the light.
const dust = Array.from({ length: 110 }, () => ({
  x: rnd() * W, y: rnd() * H, s: 0.6 + rnd() * 1.6, sp: 1 + Math.floor(rnd() * 2), ph: rnd() * TAU, a: 0.3 + rnd() * 0.6,
}));

// The brand's brow arch (same curve family as the logo), across the upper-middle.
const arch = (u) => {
  const x0 = 110, y0 = 600, x1 = 250, y1 = 470, x2 = 470, y2 = 440, x3 = 620, y3 = 520, v = 1 - u;
  return [v*v*v*x0 + 3*v*v*u*x1 + 3*v*u*u*x2 + u*u*u*x3, v*v*v*y0 + 3*v*v*u*y1 + 3*v*u*u*y2 + u*u*u*y3];
};

function frame(t) {
  const p = t / T; // 0..1 loop phase

  // Deep warm black base.
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#0b0807'; g.fillRect(0, 0, W, H);

  // Key light: a large warm glow drifting on a slow ellipse (like window light moving).
  const kx = W * 0.62 + Math.cos(TAU * p) * 90, ky = H * 0.36 + Math.sin(TAU * p) * 70;
  let rg = g.createRadialGradient(kx, ky, 0, kx, ky, H * 0.62);
  rg.addColorStop(0, 'rgba(255,186,132,0.42)'); rg.addColorStop(0.35, 'rgba(190,120,80,0.16)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalCompositeOperation = 'screen'; g.fillStyle = rg; g.fillRect(0, 0, W, H);
  // Fill light from below-left, cooler and dimmer.
  rg = g.createRadialGradient(W * 0.1, H * 0.95, 0, W * 0.1, H * 0.95, H * 0.55);
  rg.addColorStop(0, 'rgba(160,130,120,0.16)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.fillRect(0, 0, W, H);

  // Bokeh discs.
  for (const b of bokeh) {
    const x = b.x + Math.sin(TAU * p * b.k + b.ph) * b.ax, y = b.y + Math.cos(TAU * p * b.k + b.ph) * b.ay;
    const breathe = 0.7 + 0.3 * Math.sin(TAU * p * 2 + b.ph);
    const d = g.createRadialGradient(x, y, 0, x, y, b.r);
    const a = b.a * breathe;
    d.addColorStop(0, `rgba(${b.hue},${a * 0.55})`); d.addColorStop(0.82, `rgba(${b.hue},${a * 0.8})`);
    d.addColorStop(0.93, `rgba(${b.hue},${a})`); d.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = d; g.beginPath(); g.arc(x, y, b.r, 0, TAU); g.fill();
  }

  // Dust, brighter near the key light.
  for (const d of dust) {
    const y = (d.y - p * H * 0.16 * d.sp + H) % H, x = d.x + Math.sin(TAU * p * d.sp + d.ph) * 12;
    const lit = Math.max(0, 1 - Math.hypot(x - kx, y - ky) / 520);
    g.fillStyle = `rgba(255,232,210,${d.a * (0.15 + lit)})`;
    g.beginPath(); g.arc(x, y, d.s, 0, TAU); g.fill();
  }

  // Brow arch: a fine line, with a glint of light travelling along it (twice per loop).
  g.lineCap = 'round';
  g.strokeStyle = 'rgba(255,236,220,0.10)'; g.lineWidth = 1.4;
  g.beginPath(); for (let i = 0; i <= 60; i++) { const [x, y] = arch(i / 60); i ? g.lineTo(x, y) : g.moveTo(x, y); } g.stroke();
  const head = (p * 2) % 1;
  for (let i = 0; i < 60; i++) {
    const u0 = i / 60, u1 = (i + 1) / 60, m = (u0 + u1) / 2;
    let dist = Math.abs(m - head); dist = Math.min(dist, 1 - dist);
    const glow = Math.exp(-(dist * dist) / 0.004);
    if (glow < 0.02) continue;
    const [xa, ya] = arch(u0), [xb, yb] = arch(u1);
    g.strokeStyle = `rgba(255,240,226,${0.75 * glow})`; g.lineWidth = 1.6 + glow * 1.4;
    g.beginPath(); g.moveTo(xa, ya); g.lineTo(xb, yb); g.stroke();
  }
  const [hx, hy] = arch(head);
  rg = g.createRadialGradient(hx, hy, 0, hx, hy, 46);
  rg.addColorStop(0, 'rgba(255,236,214,0.35)'); rg.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = rg; g.beginPath(); g.arc(hx, hy, 46, 0, TAU); g.fill();

  // Film grain, then a vignette.
  g.globalCompositeOperation = 'source-over';
  const img = g.getImageData(0, 0, W, H), px = img.data;
  let s = Math.floor(t * 30) * 9973 + 1;
  for (let i = 0; i < px.length; i += 4) {
    s = (s * 16807) % 2147483647; const n = ((s / 2147483647) - 0.5) * 14;
    px[i] += n; px[i + 1] += n; px[i + 2] += n;
  }
  g.putImageData(img, 0, 0);
  const vg = g.createRadialGradient(W / 2, H * 0.45, H * 0.3, W / 2, H / 2, H * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  g.fillStyle = vg; g.fillRect(0, 0, W, H);
}
window.renderFrame = (t) => { frame(t); return c.toDataURL('image/jpeg', 0.92); };
</script></body></html>
